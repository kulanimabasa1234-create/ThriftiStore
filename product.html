<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | THRIFTI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f8fafc; padding-top: 80px; padding-bottom: 40px; }
    /* Navbar (same as before) */
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .logo { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, #0f3b2c, #1e6b4c); background-clip: text; -webkit-background-clip: text; color: transparent; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .logo small { font-size: 0.7rem; background: #e6f7ef; color: #1e6b4c; padding: 2px 8px; border-radius: 40px; margin-left: 6px; }
    .nav-categories { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-categories button { background: #f1f5f9; border: none; padding: 6px 14px; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .search-box { flex: 1; min-width: 180px; max-width: 300px; }
    .search-box input { width: 100%; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 40px; font-size: 0.85rem; background: #f8fafc; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .nav-actions a, .nav-actions button { background: transparent; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 40px; text-decoration: none; color: #1e293b; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .nav-actions a:hover, .nav-actions button:hover { background: #f1f5f9; }
    .user-greeting { background: #1e6b4c; color: white; padding: 4px 12px; border-radius: 40px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .user-greeting button { background: none; border: none; color: #ffd966; cursor: pointer; font-weight: 600; }
    .dropdown { position: relative; display: inline-block; }
    .dropdown button { background: transparent; border: none; font-size: 1.4rem; cursor: pointer; padding: 0 6px; }
    .dropdown-content { display: none; position: absolute; right: 0; background: white; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 16px; padding: 8px 0; z-index: 1001; border: 1px solid #e2e8f0; }
    .dropdown-content a, .dropdown-content button { display: block; width: 100%; padding: 8px 20px; text-align: left; background: none; border: none; font-size: 0.85rem; color: #1e293b; cursor: pointer; text-decoration: none; }
    .dropdown-content a:hover, .dropdown-content button:hover { background: #f1f5f9; }
    .dropdown.show .dropdown-content { display: block; }
    .badge-cart, .badge-wishlist { background: #e67e22; color: white; border-radius: 50%; padding: 0 6px; font-size: 0.7rem; margin-left: 2px; }

    .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 32px; padding: 24px; }
    .back-link { color: #1e6b4c; text-decoration: none; display: inline-block; margin-bottom: 16px; }
    .product-image { text-align: center; margin: 16px 0; }
    .product-image img { max-width: 100%; max-height: 300px; border-radius: 20px; }
    .price { font-size: 2rem; color: #e67e22; font-weight: 800; margin: 12px 0; }
    .info { background: #f1f5f9; padding: 16px; border-radius: 20px; margin: 16px 0; }
    .stock-info { display: inline-block; background: #e6f7ef; color: #1e6b4c; padding: 4px 12px; border-radius: 40px; font-weight: 600; }
    .stock-low { background: #fed7aa; color: #9a3412; }
    .stock-out { background: #fee2e2; color: #b91c1c; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    .btn-group .btn {
      flex: 1 0 auto;
      min-width: 120px;
      padding: 12px 16px;
      border-radius: 40px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-primary { background: #1e6b4c; color: white; }
    .btn-primary:hover { background: #15593e; }
    .btn-warning { background: #e67e22; color: white; }
    .btn-warning:hover { background: #d35400; }
    .btn-chat { background: #3b82f6; color: white; }
    .btn-chat:hover { background: #2563eb; }
    .btn-wishlist { background: #f43f5e; color: white; }
    .btn-wishlist:hover { background: #e11d48; }
    .btn-report { background: #ef4444; color: white; }
    .btn-report:hover { background: #dc2626; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-edit:hover { background: #2563eb; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-delete:hover { background: #dc2626; }
    .btn-disabled { background: #9ca3af; color: #4b5563; cursor: not-allowed; }

    .edit-form { margin-top: 20px; background: #fef9e6; padding: 20px; border-radius: 20px; }
    .edit-form input, .edit-form textarea, .edit-form select {
      width: 100%;
      padding: 8px;
      margin: 8px 0 16px;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
    }
    .edit-form .btn-save { background: #1e6b4c; color: white; border: none; padding: 8px 24px; border-radius: 40px; cursor: pointer; }
    .edit-form .btn-cancel { background: #9ca3af; color: white; border: none; padding: 8px 24px; border-radius: 40px; cursor: pointer; margin-left: 8px; }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar" id="mainNavbar">
  <a href="index.html" class="logo">THRIFTI <small>local · trusted</small></a>
  <div class="nav-categories">
    <button onclick="window.location.href='index.html'">All</button>
    <button onclick="window.location.href='index.html?cat=clothes'">Clothes</button>
    <button onclick="window.location.href='index.html?cat=electronics'">Electronics</button>
    <button onclick="window.location.href='index.html?cat=shoes'">Shoes</button>
    <button onclick="window.location.href='index.html?cat=furniture'">Furniture</button>
  </div>
  <div class="search-box">
    <input type="text" placeholder="🔍 Search..." onkeydown="if(event.key==='Enter') window.location.href='index.html?q='+encodeURIComponent(this.value)">
  </div>
  <div class="nav-actions" id="navActions"></div>
</nav>

<div class="container" id="productContainer">
  <a href="index.html" class="back-link">← Back</a>
  <div id="productDetail">Loading...</div>
</div>

<script>
  const API_BASE = 'https://thriftistore-xh2m.onrender.com/api.php';

  async function apiCall(action, method = 'GET', data = null) {
    const url = `${API_BASE}?action=${action}`;
    const options = { method };
    if (data) {
      options.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
      options.body = new URLSearchParams(data);
    }
    const res = await fetch(url, options);
    return await res.json();
  }

  let currentUser = null;
  let productData = null;
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
  }

  async function checkUser() {
    const data = await apiCall('get_user');
    if (data.success) {
      currentUser = data.user;
    } else {
      currentUser = null;
    }
    updateNavbar();
    updateCounts();
    if (!productData) loadProduct();
    else renderProduct();
  }

  function updateNavbar() {
    const actions = document.getElementById('navActions');
    if (currentUser) {
      const isAdmin = currentUser.email === 'admin@thrifti.com';
      actions.innerHTML = `
        <div class="user-greeting">👋 ${escapeHtml(currentUser.name)} <button id="logoutBtn">Logout</button></div>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="mylistings.html">📋 My Listings</a>
            <a href="mychats.html">💬 My Chats</a>
            <a href="sell.html">📦 SELL</a>
            ${isAdmin ? '<a href="admin.html">🔧 Admin</a>' : ''}
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await apiCall('logout', 'POST');
        currentUser = null;
        updateNavbar();
        window.location.reload();
      });
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
      updateCounts();
    } else {
      actions.innerHTML = `
        <a href="login.html" class="login-link">Log in</a>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="login.html?admin=1">🔐 Admin Login</a>
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
      updateCounts();
    }
  }

  async function updateCounts() {
    if (!currentUser) {
      document.getElementById('cartCount').textContent = '0';
      document.getElementById('wishlistCount').textContent = '0';
      return;
    }
    try {
      const cartData = await apiCall('cart');
      if (cartData.success) {
        const total = cartData.cart.reduce((s, i) => s + i.quantity, 0);
        document.getElementById('cartCount').textContent = total;
      }
      const wishData = await apiCall('wishlist');
      if (wishData.success) {
        document.getElementById('wishlistCount').textContent = wishData.wishlist.length;
      }
    } catch(e) {}
  }

  async function loadProduct() {
    if (!productId) { document.getElementById('productDetail').innerHTML = '<p>Invalid product.</p>'; return; }
    const data = await apiCall('listings');
    if (data.success) {
      productData = data.listings.find(p => p.id == productId);
      if (!productData) {
        document.getElementById('productDetail').innerHTML = '<p>Product not found or out of stock.</p>';
        return;
      }
      renderProduct();
    }
  }

  function renderProduct() {
    const p = productData;
    const isSeller = currentUser && currentUser.email === p.seller_email;
    const stock = parseInt(p.stock) || 0;
    const stockClass = stock <= 0 ? 'stock-out' : (stock <= 3 ? 'stock-low' : '');
    const stockText = stock <= 0 ? 'Out of Stock' : `${stock} left`;

    let buttons = '';
    if (isSeller) {
      buttons = `
        <div class="btn-group">
          <button class="btn btn-edit" id="editBtn">✏️ Edit</button>
          <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
        </div>
        <div class="edit-form" id="editFormContainer" style="display:none;"></div>
      `;
    } else {
      const disableBuy = stock <= 0 || !currentUser;
      buttons = `
        <div class="btn-group">
          <button class="btn btn-primary" id="addToCartBtn" ${disableBuy ? 'disabled' : ''}>🛒 Add to Cart</button>
          <button class="btn btn-warning" id="buyNowBtn" ${disableBuy ? 'disabled' : ''}>⚡ Buy Now</button>
          <a href="chat.html?sellerEmail=${encodeURIComponent(p.seller_email)}&productName=${encodeURIComponent(p.name)}&productId=${p.id}" class="btn btn-chat" style="display:inline-block; text-align:center;">💬 Chat</a>
          <button class="btn btn-wishlist" id="wishlistBtn">🤍 Add to Wishlist</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-report" id="reportItemBtn">⚠️ Report Item</button>
          <button class="btn btn-report" id="reportUserBtn">⚠️ Report Seller</button>
        </div>
      `;
    }

    document.getElementById('productDetail').innerHTML = `
      <div class="product-image">${p.image ? `<img src="${p.image}">` : `<div style="font-size:5rem;">${p.image_icon || '📦'}</div>`}</div>
      <h1>${escapeHtml(p.name)}</h1>
      <div class="price">R ${parseFloat(p.price).toLocaleString()}</div>
      <div class="info">
        <p><strong>📍 Location:</strong> ${escapeHtml(p.location)}</p>
        <p><strong>👤 Seller:</strong> ${escapeHtml(p.seller_name || p.seller_email)}</p>
        <p><strong>📝 Description:</strong> ${escapeHtml(p.description || '')}</p>
        <p><strong>📦 Stock:</strong> <span class="stock-info ${stockClass}">${stockText}</span></p>
      </div>
      ${buttons}
      <a href="cart.html" class="back-link">View Cart →</a>
    `;
    attachEvents();
  }

  function attachEvents() {
    const requireLogin = (callback) => {
      if (!currentUser) {
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }
      callback();
    };

    const addToCartBtn = document.getElementById('addToCartBtn');
    if (addToCartBtn) {
      addToCartBtn.addEventListener('click', () => requireLogin(addToCart));
    }
    document.getElementById('buyNowBtn')?.addEventListener('click', () => requireLogin(buyNow));
    document.getElementById('wishlistBtn')?.addEventListener('click', () => requireLogin(toggleWishlist));
    document.getElementById('reportItemBtn')?.addEventListener('click', () => requireLogin(reportItem));
    document.getElementById('reportUserBtn')?.addEventListener('click', () => requireLogin(reportUser));
    document.getElementById('editBtn')?.addEventListener('click', showEditForm);
    document.getElementById('deleteBtn')?.addEventListener('click', deleteListing);
  }

  async function addToCart() {
    const quantity = 1; // default, could allow multiple
    const data = await apiCall('cart', 'POST', { listing_id: productData.id, quantity });
    if (data.success) {
      alert('Added to cart!');
      updateCounts();
    } else {
      alert(data.error || 'Failed to add to cart.');
    }
  }

  async function buyNow() {
    await addToCart();
    window.location.href = 'cart.html';
  }

  async function toggleWishlist() {
    const data = await apiCall('wishlist');
    if (data.success) {
      const inWishlist = data.wishlist.some(item => item.id == productData.id);
      if (inWishlist) {
        await apiCall('wishlist', 'DELETE', { listing_id: productData.id });
        alert('Removed from wishlist.');
      } else {
        await apiCall('wishlist', 'POST', { listing_id: productData.id });
        alert('Added to wishlist.');
      }
      // reload to update button text
      location.reload();
    }
  }

  function reportItem() {
    const reason = prompt('Why are you reporting this item?');
    if (reason && reason.trim()) {
      apiCall('report_item', 'POST', { listing_id: productData.id, reason });
      alert('Report submitted.');
    }
  }

  function reportUser() {
    const reason = prompt('Why are you reporting this seller?');
    if (reason && reason.trim()) {
      // get user id from email (use a separate API call if needed)
      alert('Report submitted.');
    }
  }

  function showEditForm() {
    const container = document.getElementById('editFormContainer');
    container.style.display = 'block';
    container.innerHTML = `
      <h3>Edit Listing</h3>
      <label>Name:</label><input type="text" id="editName" value="${escapeHtml(productData.name)}">
      <label>Price (R):</label><input type="number" id="editPrice" value="${productData.price}">
      <label>Category:</label>
      <select id="editCategory">
        <option value="clothes" ${productData.category==='clothes'?'selected':''}>Clothes</option>
        <option value="electronics" ${productData.category==='electronics'?'selected':''}>Electronics</option>
        <option value="shoes" ${productData.category==='shoes'?'selected':''}>Shoes</option>
        <option value="furniture" ${productData.category==='furniture'?'selected':''}>Furniture</option>
      </select>
      <label>Location:</label><input type="text" id="editLocation" value="${escapeHtml(productData.location)}">
      <label>Stock:</label><input type="number" id="editStock" value="${productData.stock || 1}" min="1">
      <label>Description:</label><textarea id="editDesc">${escapeHtml(productData.description || '')}</textarea>
      <button class="btn-save" id="saveEditBtn">Save</button>
      <button class="btn-cancel" id="cancelEditBtn">Cancel</button>
    `;
    document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      container.style.display = 'none';
    });
  }

  async function saveEdit() {
    const name = document.getElementById('editName').value.trim();
    const price = parseFloat(document.getElementById('editPrice').value);
    const category = document.getElementById('editCategory').value;
    const location = document.getElementById('editLocation').value.trim();
    const stock = parseInt(document.getElementById('editStock').value) || 1;
    const description = document.getElementById('editDesc').value.trim();

    if (!name || isNaN(price) || !location) {
      alert('Please fill all required fields.');
      return;
    }

    const data = await apiCall('update_listing', 'POST', {
      id: productData.id,
      name, price, category, location, stock, description
    });
    if (data.success) {
      alert('Listing updated!');
      window.location.reload();
    } else {
      alert('Update failed: ' + data.error);
    }
  }

  async function deleteListing() {
    if (confirm('Delete this listing?')) {
      const data = await apiCall('delete_listing', 'POST', { id: productData.id });
      if (data.success) {
        alert('Deleted.');
        window.location.href = 'index.html';
      } else {
        alert('Delete failed: ' + data.error);
      }
    }
  }

  checkUser();
</script>
</body>
</html>
