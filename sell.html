<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell | THRIFTI</title>
  <style>
    /* Same navbar styles – we'll reuse */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', Roboto, sans-serif; background:#f8fafc; padding-top:80px; padding-bottom:40px; }
    .navbar { position:fixed; top:0; left:0; right:0; z-index:1000; background:white; border-bottom:1px solid #e2e8f0; padding:8px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,0.03); }
    .logo { font-size:1.6rem; font-weight:700; background:linear-gradient(135deg,#0f3b2c,#1e6b4c); background-clip:text; -webkit-background-clip:text; color:transparent; cursor:pointer; text-decoration:none; white-space:nowrap; }
    .logo small { font-size:0.7rem; background:#e6f7ef; color:#1e6b4c; padding:2px 8px; border-radius:40px; margin-left:6px; }
    .nav-categories { display:flex; gap:8px; flex-wrap:wrap; }
    .nav-categories button { background:#f1f5f9; border:none; padding:6px 14px; border-radius:40px; font-weight:600; font-size:0.8rem; cursor:pointer; }
    .search-box { flex:1; min-width:180px; max-width:300px; }
    .search-box input { width:100%; padding:6px 14px; border:1px solid #cbd5e1; border-radius:40px; font-size:0.85rem; background:#f8fafc; }
    .nav-actions { display:flex; align-items:center; gap:10px; }
    .nav-actions a, .nav-actions button { background:transparent; border:1px solid #cbd5e1; padding:6px 14px; border-radius:40px; text-decoration:none; color:#1e293b; font-weight:600; font-size:0.8rem; cursor:pointer; }
    .nav-actions a:hover, .nav-actions button:hover { background:#f1f5f9; }
    .user-greeting { background:#1e6b4c; color:white; padding:4px 12px; border-radius:40px; display:flex; align-items:center; gap:8px; font-size:0.8rem; }
    .user-greeting button { background:none; border:none; color:#ffd966; cursor:pointer; font-weight:600; }
    .dropdown { position:relative; display:inline-block; }
    .dropdown button { background:transparent; border:none; font-size:1.4rem; cursor:pointer; padding:0 6px; }
    .dropdown-content { display:none; position:absolute; right:0; background:white; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,0.1); border-radius:16px; padding:8px 0; z-index:1001; border:1px solid #e2e8f0; }
    .dropdown-content a, .dropdown-content button { display:block; width:100%; padding:8px 20px; text-align:left; background:none; border:none; font-size:0.85rem; color:#1e293b; cursor:pointer; text-decoration:none; }
    .dropdown-content a:hover, .dropdown-content button:hover { background:#f1f5f9; }
    .dropdown.show .dropdown-content { display:block; }
    .badge-cart, .badge-wishlist { background:#e67e22; color:white; border-radius:50%; padding:0 6px; font-size:0.7rem; margin-left:2px; }

    .container { max-width:600px; margin:0 auto; background:white; border-radius:32px; padding:24px; }
    .back-link { color:#1e6b4c; text-decoration:none; display:inline-block; margin-bottom:16px; }
    h1 { margin-bottom:16px; }
    .input-group { margin-bottom:16px; }
    label { display:block; font-weight:600; margin-bottom:4px; }
    input, select, textarea { width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:40px; margin-top:4px; }
    textarea { border-radius:20px; }
    .submit-btn { background:#e67e22; color:white; border:none; padding:12px; border-radius:40px; font-weight:bold; width:100%; cursor:pointer; }
    .error { background:#fee2e2; color:#b91c1c; padding:10px; border-radius:30px; margin-bottom:16px; text-align:center; }
    #imagePreview { margin-top:10px; display:none; }
    #previewImg { max-width:100px; border-radius:12px; border:1px solid #ddd; }
  </style>
</head>
<body>
<nav class="navbar" id="mainNavbar">
  <a href="index.html" class="logo">THRIFTI <small>local · trusted</small></a>
  <div class="nav-categories">
    <button onclick="window.location.href='index.html'">All</button>
    <button onclick="window.location.href='index.html?cat=clothes'">Clothes</button>
    <button onclick="window.location.href='index.html?cat=electronics'">Electronics</button>
    <button onclick="window.location.href='index.html?cat=shoes'">Shoes</button>
    <button onclick="window.location.href='index.html?cat=furniture'">Furniture</button>
  </div>
  <div class="search-box">
    <input type="text" placeholder="🔍 Search..." onkeydown="if(event.key==='Enter') window.location.href='index.html?q='+encodeURIComponent(this.value)">
  </div>
  <div class="nav-actions" id="navActions"></div>
</nav>

<div class="container">
  <a href="index.html" class="back-link">← Back</a>
  <h1>📦 Sell an Item</h1>
  <div id="sellFormContainer"></div>
</div>

<script>
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function updateNavbar() {
    const loggedIn = localStorage.getItem('thrifti_logged_in');
    const actions = document.getElementById('navActions');
    if (loggedIn) {
      const user = JSON.parse(loggedIn);
      const isAdmin = (user.email === 'admin@thrifti.com');
      actions.innerHTML = `
        <div class="user-greeting">👋 ${escapeHtml(user.name)} <button id="logoutBtn">Logout</button></div>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="mylistings.html">📋 My Listings</a>
            <a href="mychats.html">💬 My Chats</a>
            <a href="sell.html">📦 SELL</a>
            ${isAdmin ? '<a href="admin.html">🔧 Admin</a>' : ''}
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      updateCounts();
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        localStorage.removeItem('thrifti_logged_in');
        location.reload();
      });
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
    } else {
      actions.innerHTML = `
        <a href="login.html" class="login-link">Log in</a>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      updateCounts();
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
    }
  }
  function updateCounts() {
    const cart = JSON.parse(localStorage.getItem('thrifti_cart') || '[]');
    const total = cart.reduce((s,i) => s + i.quantity, 0);
    const wish = JSON.parse(localStorage.getItem('thrifti_wishlist') || '[]');
    const cBadge = document.getElementById('cartCount');
    const wBadge = document.getElementById('wishlistCount');
    if (cBadge) cBadge.textContent = total;
    if (wBadge) wBadge.textContent = wish.length;
  }
  updateNavbar();

  // Sell form logic
  const loggedIn = localStorage.getItem('thrifti_logged_in');
  if (!loggedIn) {
    document.getElementById('sellFormContainer').innerHTML = `
      <div class="error">🔐 Please <a href="login.html">log in</a> to sell items.</div>
    `;
  } else {
    const user = JSON.parse(loggedIn);
    document.getElementById('sellFormContainer').innerHTML = `
      <form id="sellForm">
        <div class="input-group"><label>Item name *</label><input type="text" id="itemName" required></div>
        <div class="input-group"><label>Category *</label>
          <select id="category" required>
            <option value="">-- Select --</option>
            <option value="clothes">Clothes</option>
            <option value="electronics">Electronics</option>
            <option value="shoes">Shoes</option>
            <option value="furniture">Furniture</option>
          </select>
        </div>
        <div class="input-group"><label>Price (R) *</label><input type="number" id="price" required></div>
        <div class="input-group"><label>Description</label><textarea id="description" rows="3"></textarea></div>
        <div class="input-group"><label>Location (town/suburb) *</label><input type="text" id="location" required></div>
        <div class="input-group"><label>Image (optional)</label><input type="file" id="productImage" accept="image/*"><div id="imagePreview"><img id="previewImg" src="#"></div></div>
        <button type="submit" class="submit-btn">✅ List Item</button>
      </form>
    `;

    const fileInput = document.getElementById('productImage');
    const previewDiv = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewImg.src = ev.target.result;
          previewDiv.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        previewDiv.style.display = 'none';
      }
    });

    document.getElementById('sellForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('itemName').value.trim();
      const category = document.getElementById('category').value;
      const price = parseFloat(document.getElementById('price').value);
      const description = document.getElementById('description').value.trim();
      const location = document.getElementById('location').value.trim();
      const imageFile = document.getElementById('productImage').files[0];

      if (!name || !category || isNaN(price) || !location) {
        alert('Please fill required fields.');
        return;
      }
      const saveListing = (imageData) => {
        let listings = JSON.parse(localStorage.getItem('thrifti_listings') || '[]');
        const newItem = {
          id: Date.now(),
          name, category, price, description, location,
          image: imageData || null,
          imageIcon: '📦',
          sellerName: user.name,
          sellerEmail: user.email,
          createdAt: new Date().toISOString()
        };
        listings.push(newItem);
        localStorage.setItem('thrifti_listings', JSON.stringify(listings));
        alert('Item listed!');
        window.location.href = 'index.html';
      };
      if (imageFile) {
        const reader = new FileReader();
        reader.onload = (ev) => saveListing(ev.target.result);
        reader.readAsDataURL(imageFile);
      } else {
        saveListing(null);
      }
    });
  }
</script>
</body>
</html>
