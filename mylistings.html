<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings | THRIFTI</title>
  <style>
    /* Same navbar styles – we'll reuse from cart.html */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', Roboto, sans-serif; background:#f8fafc; padding-top:80px; padding-bottom:40px; }
    .navbar { position:fixed; top:0; left:0; right:0; z-index:1000; background:white; border-bottom:1px solid #e2e8f0; padding:8px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,0.03); }
    .logo { font-size:1.6rem; font-weight:700; background:linear-gradient(135deg,#0f3b2c,#1e6b4c); background-clip:text; -webkit-background-clip:text; color:transparent; cursor:pointer; text-decoration:none; white-space:nowrap; }
    .logo small { font-size:0.7rem; background:#e6f7ef; color:#1e6b4c; padding:2px 8px; border-radius:40px; margin-left:6px; }
    .nav-categories { display:flex; gap:8px; flex-wrap:wrap; }
    .nav-categories button { background:#f1f5f9; border:none; padding:6px 14px; border-radius:40px; font-weight:600; font-size:0.8rem; cursor:pointer; }
    .search-box { flex:1; min-width:180px; max-width:300px; }
    .search-box input { width:100%; padding:6px 14px; border:1px solid #cbd5e1; border-radius:40px; font-size:0.85rem; background:#f8fafc; }
    .nav-actions { display:flex; align-items:center; gap:10px; }
    .nav-actions a, .nav-actions button { background:transparent; border:1px solid #cbd5e1; padding:6px 14px; border-radius:40px; text-decoration:none; color:#1e293b; font-weight:600; font-size:0.8rem; cursor:pointer; }
    .nav-actions a:hover, .nav-actions button:hover { background:#f1f5f9; }
    .user-greeting { background:#1e6b4c; color:white; padding:4px 12px; border-radius:40px; display:flex; align-items:center; gap:8px; font-size:0.8rem; }
    .user-greeting button { background:none; border:none; color:#ffd966; cursor:pointer; font-weight:600; }
    .dropdown { position:relative; display:inline-block; }
    .dropdown button { background:transparent; border:none; font-size:1.4rem; cursor:pointer; padding:0 6px; }
    .dropdown-content { display:none; position:absolute; right:0; background:white; min-width:180px; box-shadow:0 8px 16px rgba(0,0,0,0.1); border-radius:16px; padding:8px 0; z-index:1001; border:1px solid #e2e8f0; }
    .dropdown-content a, .dropdown-content button { display:block; width:100%; padding:8px 20px; text-align:left; background:none; border:none; font-size:0.85rem; color:#1e293b; cursor:pointer; text-decoration:none; }
    .dropdown-content a:hover, .dropdown-content button:hover { background:#f1f5f9; }
    .dropdown.show .dropdown-content { display:block; }
    .badge-cart, .badge-wishlist { background:#e67e22; color:white; border-radius:50%; padding:0 6px; font-size:0.7rem; margin-left:2px; }

    .container { max-width:1000px; margin:0 auto; background:white; border-radius:32px; padding:24px; }
    .back-link { color:#1e6b4c; text-decoration:none; display:inline-block; margin-bottom:16px; }
    .listing-card { display:flex; gap:16px; border-bottom:1px solid #e2e8f0; padding:16px 0; align-items:center; }
    .listing-image { width:80px; height:80px; background:#eef2ff; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2rem; overflow:hidden; }
    .listing-image img { width:100%; height:100%; object-fit:cover; }
    .listing-info { flex:1; }
    .listing-info h3 { font-weight:bold; }
    .listing-info .price { color:#e67e22; font-weight:bold; }
    .empty { text-align:center; padding:40px; color:#6c757d; }
    .btn-edit { background:#3b82f6; color:white; border:none; padding:6px 16px; border-radius:40px; cursor:pointer; }
    .btn-delete { background:#ef4444; color:white; border:none; padding:6px 16px; border-radius:40px; cursor:pointer; }
    .edit-form { margin-top:10px; background:#fef9e6; padding:16px; border-radius:20px; display:none; }
    .edit-form input, .edit-form textarea, .edit-form select { width:100%; padding:6px; margin:4px 0 12px; border:1px solid #cbd5e1; border-radius:40px; }
  </style>
</head>
<body>
<nav class="navbar" id="mainNavbar">
  <a href="index.html" class="logo">THRIFTI <small>local · trusted</small></a>
  <div class="nav-categories">
    <button onclick="window.location.href='index.html'">All</button>
    <button onclick="window.location.href='index.html?cat=clothes'">Clothes</button>
    <button onclick="window.location.href='index.html?cat=electronics'">Electronics</button>
    <button onclick="window.location.href='index.html?cat=shoes'">Shoes</button>
    <button onclick="window.location.href='index.html?cat=furniture'">Furniture</button>
  </div>
  <div class="search-box">
    <input type="text" placeholder="🔍 Search..." onkeydown="if(event.key==='Enter') window.location.href='index.html?q='+encodeURIComponent(this.value)">
  </div>
  <div class="nav-actions" id="navActions"></div>
</nav>

<div class="container">
  <a href="index.html" class="back-link">← Back to marketplace</a>
  <h1>📋 My Listings</h1>
  <div id="listingsContainer">Loading...</div>
</div>

<script>
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function updateNavbar() {
    const loggedIn = localStorage.getItem('thrifti_logged_in');
    const actions = document.getElementById('navActions');
    if (loggedIn) {
      const user = JSON.parse(loggedIn);
      const isAdmin = (user.email === 'admin@thrifti.com');
      actions.innerHTML = `
        <div class="user-greeting">👋 ${escapeHtml(user.name)} <button id="logoutBtn">Logout</button></div>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="mylistings.html">📋 My Listings</a>
            <a href="mychats.html">💬 My Chats</a>
            <a href="sell.html">📦 SELL</a>
            ${isAdmin ? '<a href="admin.html">🔧 Admin</a>' : ''}
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      updateCounts();
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        localStorage.removeItem('thrifti_logged_in');
        location.reload();
      });
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
    } else {
      actions.innerHTML = `
        <a href="login.html" class="login-link">Log in</a>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      updateCounts();
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
    }
  }
  function updateCounts() {
    const cart = JSON.parse(localStorage.getItem('thrifti_cart') || '[]');
    const total = cart.reduce((s,i) => s + i.quantity, 0);
    const wish = JSON.parse(localStorage.getItem('thrifti_wishlist') || '[]');
    const cBadge = document.getElementById('cartCount');
    const wBadge = document.getElementById('wishlistCount');
    if (cBadge) cBadge.textContent = total;
    if (wBadge) wBadge.textContent = wish.length;
  }
  updateNavbar();

  // My Listings logic
  function renderMyListings() {
    const loggedIn = localStorage.getItem('thrifti_logged_in');
    if (!loggedIn) {
      document.getElementById('listingsContainer').innerHTML = '<div class="empty">Please log in to view your listings.</div>';
      return;
    }
    const user = JSON.parse(loggedIn);
    const all = JSON.parse(localStorage.getItem('thrifti_listings') || '[]');
    const mine = all.filter(l => l.sellerEmail === user.email);
    const container = document.getElementById('listingsContainer');
    if (mine.length === 0) {
      container.innerHTML = '<div class="empty">You haven\'t listed any items yet. <a href="sell.html" style="color:#1e6b4c;">Sell your first item</a></div>';
      return;
    }
    let html = '';
    mine.forEach(listing => {
      html += `
        <div class="listing-card" data-id="${listing.id}">
          <div class="listing-image">
            ${listing.image ? `<img src="${listing.image}" alt="${listing.name}">` : (listing.imageIcon || '📦')}
          </div>
          <div class="listing-info">
            <h3>${escapeHtml(listing.name)}</h3>
            <div class="price">R ${listing.price.toLocaleString()}</div>
            <div>${escapeHtml(listing.location)}</div>
          </div>
          <div>
            <button class="btn-edit" data-id="${listing.id}">✏️ Edit</button>
            <button class="btn-delete" data-id="${listing.id}">🗑️ Delete</button>
          </div>
          <div class="edit-form" id="editForm-${listing.id}"></div>
        </div>
      `;
    });
    container.innerHTML = html;

    // Edit and Delete events
    document.querySelectorAll('.btn-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id);
        const listing = mine.find(l => l.id === id);
        if (!listing) return;
        const formDiv = document.getElementById(`editForm-${id}`);
        formDiv.style.display = 'block';
        formDiv.innerHTML = `
          <label>Name:</label><input type="text" id="editName-${id}" value="${escapeHtml(listing.name)}">
          <label>Price (R):</label><input type="number" id="editPrice-${id}" value="${listing.price}">
          <label>Category:</label>
          <select id="editCat-${id}">
            <option value="clothes" ${listing.category==='clothes'?'selected':''}>Clothes</option>
            <option value="electronics" ${listing.category==='electronics'?'selected':''}>Electronics</option>
            <option value="shoes" ${listing.category==='shoes'?'selected':''}>Shoes</option>
            <option value="furniture" ${listing.category==='furniture'?'selected':''}>Furniture</option>
          </select>
          <label>Location:</label><input type="text" id="editLoc-${id}" value="${escapeHtml(listing.location)}">
          <label>Description:</label><textarea id="editDesc-${id}">${escapeHtml(listing.description || '')}</textarea>
          <button class="btn-save-edit" data-id="${id}">Save</button>
          <button class="btn-cancel-edit" data-id="${id}">Cancel</button>
        `;
        document.querySelector(`#editForm-${id} .btn-save-edit`).addEventListener('click', () => {
          const newName = document.getElementById(`editName-${id}`).value.trim();
          const newPrice = parseFloat(document.getElementById(`editPrice-${id}`).value);
          const newCat = document.getElementById(`editCat-${id}`).value;
          const newLoc = document.getElementById(`editLoc-${id}`).value.trim();
          const newDesc = document.getElementById(`editDesc-${id}`).value.trim();
          if (!newName || isNaN(newPrice)) { alert('Fill required fields.'); return; }
          let listings = JSON.parse(localStorage.getItem('thrifti_listings') || '[]');
          const idx = listings.findIndex(l => l.id === id);
          if (idx !== -1) {
            listings[idx].name = newName;
            listings[idx].price = newPrice;
            listings[idx].category = newCat;
            listings[idx].location = newLoc;
            listings[idx].description = newDesc;
            localStorage.setItem('thrifti_listings', JSON.stringify(listings));
            alert('Listing updated.');
            renderMyListings();
          }
        });
        document.querySelector(`#editForm-${id} .btn-cancel-edit`).addEventListener('click', () => {
          formDiv.style.display = 'none';
        });
      });
    });

    document.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id);
        if (confirm('Delete this listing?')) {
          let listings = JSON.parse(localStorage.getItem('thrifti_listings') || '[]');
          listings = listings.filter(l => l.id !== id);
          localStorage.setItem('thrifti_listings', JSON.stringify(listings));
          renderMyListings();
        }
      });
    });
  }
  renderMyListings();
</script>
</body>
</html>
