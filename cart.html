<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | THRIFTI</title>
  <style>
    /* Same navbar styles as product.html – include them */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f8fafc; padding-top: 80px; padding-bottom: 40px; }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .logo { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, #0f3b2c, #1e6b4c); background-clip: text; -webkit-background-clip: text; color: transparent; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .logo small { font-size: 0.7rem; background: #e6f7ef; color: #1e6b4c; padding: 2px 8px; border-radius: 40px; margin-left: 6px; }
    .nav-categories { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-categories button { background: #f1f5f9; border: none; padding: 6px 14px; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .search-box { flex: 1; min-width: 180px; max-width: 300px; }
    .search-box input { width: 100%; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 40px; font-size: 0.85rem; background: #f8fafc; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .nav-actions a, .nav-actions button { background: transparent; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 40px; text-decoration: none; color: #1e293b; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .nav-actions a:hover, .nav-actions button:hover { background: #f1f5f9; }
    .user-greeting { background: #1e6b4c; color: white; padding: 4px 12px; border-radius: 40px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .user-greeting button { background: none; border: none; color: #ffd966; cursor: pointer; font-weight: 600; }
    .dropdown { position: relative; display: inline-block; }
    .dropdown button { background: transparent; border: none; font-size: 1.4rem; cursor: pointer; padding: 0 6px; }
    .dropdown-content { display: none; position: absolute; right: 0; background: white; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 16px; padding: 8px 0; z-index: 1001; border: 1px solid #e2e8f0; }
    .dropdown-content a, .dropdown-content button { display: block; width: 100%; padding: 8px 20px; text-align: left; background: none; border: none; font-size: 0.85rem; color: #1e293b; cursor: pointer; text-decoration: none; }
    .dropdown-content a:hover, .dropdown-content button:hover { background: #f1f5f9; }
    .dropdown.show .dropdown-content { display: block; }
    .badge-cart, .badge-wishlist { background: #e67e22; color: white; border-radius: 50%; padding: 0 6px; font-size: 0.7rem; margin-left: 2px; }

    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 32px; padding: 24px; }
    .back-link { color: #1e6b4c; text-decoration: none; display: inline-block; margin-bottom: 16px; }
    .cart-item { display: flex; gap: 16px; border-bottom: 1px solid #e2e8f0; padding: 16px 0; align-items: center; }
    .cart-item-image { width: 80px; height: 80px; background: #eef2ff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; }
    .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-details { flex: 1; }
    .cart-item-name { font-weight: bold; }
    .cart-item-price { color: #e67e22; font-weight: bold; }
    .quantity-control { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
    .quantity-control button { background: #f1f5f9; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
    .remove-btn { background: #fee2e2; color: #b91c1c; border: none; padding: 4px 12px; border-radius: 20px; cursor: pointer; }
    .cart-summary { margin-top: 24px; padding-top: 16px; border-top: 2px solid #e2e8f0; text-align: right; }
    .total { font-size: 1.5rem; font-weight: bold; }
    .checkout-btn { background: #1e6b4c; color: white; border: none; padding: 12px 32px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .empty-cart { text-align: center; padding: 40px; color: #6c757d; }
    .modal {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content { background: white; max-width: 400px; width:90%; border-radius: 32px; padding: 24px; }
    .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 40px; }
    .modal-content button { background: #e67e22; color: white; border: none; padding: 10px; border-radius: 40px; width: 100%; cursor: pointer; }
    .close-modal { float: right; cursor: pointer; font-size: 1.5rem; }
  </style>
</head>
<body>
<nav class="navbar" id="mainNavbar">
  <a href="index.html" class="logo">THRIFTI <small>local · trusted</small></a>
  <div class="nav-categories">
    <button onclick="window.location.href='index.html'">All</button>
    <button onclick="window.location.href='index.html?cat=clothes'">Clothes</button>
    <button onclick="window.location.href='index.html?cat=electronics'">Electronics</button>
    <button onclick="window.location.href='index.html?cat=shoes'">Shoes</button>
    <button onclick="window.location.href='index.html?cat=furniture'">Furniture</button>
  </div>
  <div class="search-box">
    <input type="text" placeholder="🔍 Search..." onkeydown="if(event.key==='Enter') window.location.href='index.html?q='+encodeURIComponent(this.value)">
  </div>
  <div class="nav-actions" id="navActions"></div>
</nav>

<div class="container">
  <a href="index.html" class="back-link">← Continue shopping</a>
  <h1>🛒 Your Cart</h1>
  <div id="cartItems"></div>
  <div id="cartSummary"></div>
</div>

<div id="paymentModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" id="closeModal">&times;</span>
    <h3>💳 Yoco Sandbox (Test Payment)</h3>
    <p>Use test card:</p>
    <input type="text" placeholder="Card number" id="cardNumber" value="4111 1111 1111 1111">
    <input type="text" placeholder="MM/YY" id="cardExpiry" value="12/28">
    <input type="text" placeholder="CVC" id="cardCvc" value="123">
    <button id="simulatePayBtn">Pay R <span id="modalTotal"></span></button>
    <p style="font-size:0.7rem; margin-top:12px;">🔐 Simulation – in production Yoco API would process.</p>
  </div>
</div>

<script>
  const API_BASE = 'https://thriftistore-xh2m.onrender.com/api.php';

  async function apiCall(action, method = 'GET', data = null) {
    const url = `${API_BASE}?action=${action}`;
    const options = { method };
    if (data) {
      options.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
      options.body = new URLSearchParams(data);
    }
    const res = await fetch(url, options);
    return await res.json();
  }

  let currentUser = null;

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
  }

  async function checkUser() {
    const data = await apiCall('get_user');
    if (data.success) {
      currentUser = data.user;
    } else {
      currentUser = null;
      window.location.href = 'login.html';
    }
    updateNavbar();
    updateCounts();
  }

  function updateNavbar() {
    const actions = document.getElementById('navActions');
    if (currentUser) {
      const isAdmin = currentUser.email === 'admin@thrifti.com';
      actions.innerHTML = `
        <div class="user-greeting">👋 ${escapeHtml(currentUser.name)} <button id="logoutBtn">Logout</button></div>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="mylistings.html">📋 My Listings</a>
            <a href="mychats.html">💬 My Chats</a>
            <a href="sell.html">📦 SELL</a>
            ${isAdmin ? '<a href="admin.html">🔧 Admin</a>' : ''}
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await apiCall('logout', 'POST');
        currentUser = null;
        updateNavbar();
        window.location.reload();
      });
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
      updateCounts();
    } else {
      actions.innerHTML = `
        <a href="login.html" class="login-link">Log in</a>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
      updateCounts();
    }
  }

  async function updateCounts() {
    if (!currentUser) {
      document.getElementById('cartCount').textContent = '0';
      document.getElementById('wishlistCount').textContent = '0';
      return;
    }
    try {
      const cartData = await apiCall('cart');
      if (cartData.success) {
        const total = cartData.cart.reduce((s, i) => s + i.quantity, 0);
        document.getElementById('cartCount').textContent = total;
      }
      const wishData = await apiCall('wishlist');
      if (wishData.success) {
        document.getElementById('wishlistCount').textContent = wishData.wishlist.length;
      }
    } catch(e) {}
  }

  // ---------- Cart logic ----------
  async function renderCart() {
    if (!currentUser) return;
    const data = await apiCall('cart');
    if (!data.success) { alert('Failed to load cart'); return; }
    const cart = data.cart;
    const cartDiv = document.getElementById('cartItems');
    const summaryDiv = document.getElementById('cartSummary');
    if (cart.length === 0) {
      cartDiv.innerHTML = '<div class="empty-cart">Your cart is empty. Start adding items!</div>';
      summaryDiv.innerHTML = '';
      return;
    }
    let total = 0;
    let itemsHtml = '';
    cart.forEach(item => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;
      itemsHtml += `
        <div class="cart-item" data-id="${item.listing_id}">
          <div class="cart-item-image">
            ${item.image ? `<img src="${item.image}" alt="${item.name}">` : (item.image_icon || '📦')}
          </div>
          <div class="cart-item-details">
            <div class="cart-item-name">${escapeHtml(item.name)}</div>
            <div class="cart-item-price">R ${parseFloat(item.price).toLocaleString()}</div>
            <div class="quantity-control">
              <button class="qty-minus" data-id="${item.listing_id}">-</button>
              <span>${item.quantity}</span>
              <button class="qty-plus" data-id="${item.listing_id}">+</button>
              <button class="remove-btn" data-id="${item.listing_id}">Remove</button>
            </div>
          </div>
          <div style="font-weight:bold;">R ${itemTotal.toLocaleString()}</div>
        </div>
      `;
    });
    cartDiv.innerHTML = itemsHtml;
    summaryDiv.innerHTML = `
      <div class="cart-summary">
        <div class="total">Total: R ${total.toLocaleString()}</div>
        <button class="checkout-btn" id="checkoutBtn">💳 Proceed to Payment</button>
      </div>
    `;
    document.querySelectorAll('.qty-minus').forEach(btn => {
      btn.addEventListener('click', () => updateQuantity(parseInt(btn.dataset.id), -1));
    });
    document.querySelectorAll('.qty-plus').forEach(btn => {
      btn.addEventListener('click', () => updateQuantity(parseInt(btn.dataset.id), 1));
    });
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => removeItem(parseInt(btn.dataset.id)));
    });
    document.getElementById('checkoutBtn').addEventListener('click', showPaymentModal);
  }

  async function updateQuantity(listingId, delta) {
    const data = await apiCall('cart');
    if (!data.success) return;
    const cart = data.cart;
    const item = cart.find(i => i.listing_id === listingId);
    if (!item) return;
    const newQty = item.quantity + delta;
    if (newQty <= 0) {
      await removeItem(listingId);
    } else {
      await apiCall('cart', 'POST', { listing_id: listingId, quantity: 1 });
    }
    renderCart();
    updateCounts();
  }

  async function removeItem(listingId) {
    await apiCall('cart', 'DELETE', { listing_id: listingId });
    renderCart();
    updateCounts();
  }

  // ---------- Payment ----------
  let currentTotal = 0;

  async function showPaymentModal() {
    const data = await apiCall('cart');
    if (!data.success || data.cart.length === 0) { alert('Cart empty.'); return; }
    let total = 0;
    data.cart.forEach(i => total += i.price * i.quantity);
    currentTotal = total;
    document.getElementById('modalTotal').textContent = total.toLocaleString();
    document.getElementById('paymentModal').style.display = 'flex';
  }

  document.getElementById('simulatePayBtn').addEventListener('click', async () => {
    const data = await apiCall('checkout', 'POST');
    if (data.success) {
      alert(`✅ Payment successful! Order #${data.order_id} – R ${data.total.toLocaleString()}`);
      document.getElementById('paymentModal').style.display = 'none';
      renderCart();
      updateCounts();
    } else {
      alert('Checkout failed: ' + data.error);
    }
  });

  document.getElementById('closeModal').addEventListener('click', () => {
    document.getElementById('paymentModal').style.display = 'none';
  });
  window.addEventListener('click', (e) => {
    if (e.target === document.getElementById('paymentModal')) {
      document.getElementById('paymentModal').style.display = 'none';
    }
  });

  // ---------- Init ----------
  checkUser().then(() => {
    if (currentUser) renderCart();
  });
</script>
</body>
</html>
