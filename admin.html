<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | THRIFTI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; padding-top: 80px; padding-bottom: 40px; }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .logo { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, #0f3b2c, #1e6b4c); background-clip: text; -webkit-background-clip: text; color: transparent; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .logo small { font-size: 0.7rem; background: #e6f7ef; color: #1e6b4c; padding: 2px 8px; border-radius: 40px; margin-left: 6px; }
    .nav-categories { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-categories button { background: #f1f5f9; border: none; padding: 6px 14px; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .search-box { flex: 1; min-width: 180px; max-width: 300px; }
    .search-box input { width: 100%; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 40px; font-size: 0.85rem; background: #f8fafc; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .nav-actions a, .nav-actions button { background: transparent; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 40px; text-decoration: none; color: #1e293b; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .nav-actions a:hover, .nav-actions button:hover { background: #f1f5f9; }
    .user-greeting { background: #1e6b4c; color: white; padding: 4px 12px; border-radius: 40px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
    .user-greeting button { background: none; border: none; color: #ffd966; cursor: pointer; font-weight: 600; }
    .dropdown { position: relative; display: inline-block; }
    .dropdown button { background: transparent; border: none; font-size: 1.4rem; cursor: pointer; padding: 0 6px; }
    .dropdown-content { display: none; position: absolute; right: 0; background: white; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 16px; padding: 8px 0; z-index: 1001; border: 1px solid #e2e8f0; }
    .dropdown-content a, .dropdown-content button { display: block; width: 100%; padding: 8px 20px; text-align: left; background: none; border: none; font-size: 0.85rem; color: #1e293b; cursor: pointer; text-decoration: none; }
    .dropdown-content a:hover, .dropdown-content button:hover { background: #f1f5f9; }
    .dropdown.show .dropdown-content { display: block; }
    .badge-cart, .badge-wishlist { background: #e67e22; color: white; border-radius: 50%; padding: 0 6px; font-size: 0.7rem; margin-left: 2px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { background: white; border-radius: 24px; padding: 24px; margin-bottom: 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .card h2 { border-left: 5px solid #e67e22; padding-left: 16px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; }
    button { background: #e67e22; color: white; border: none; padding: 6px 16px; border-radius: 40px; cursor: pointer; }
    .danger-btn { background: #ef4444; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #f8fafc; border-radius: 16px; padding: 16px; text-align: center; }
    .stat-number { font-size: 2rem; font-weight: bold; color: #1e6b4c; }
  </style>
</head>
<body>
<nav class="navbar" id="mainNavbar">
  <a href="index.html" class="logo">THRIFTI <small>local · trusted</small></a>
  <div class="nav-categories">
    <button onclick="window.location.href='index.html'">All</button>
    <button onclick="window.location.href='index.html?cat=clothes'">Clothes</button>
    <button onclick="window.location.href='index.html?cat=electronics'">Electronics</button>
    <button onclick="window.location.href='index.html?cat=shoes'">Shoes</button>
    <button onclick="window.location.href='index.html?cat=furniture'">Furniture</button>
  </div>
  <div class="search-box">
    <input type="text" placeholder="🔍 Search..." onkeydown="if(event.key==='Enter') window.location.href='index.html?q='+encodeURIComponent(this.value)">
  </div>
  <div class="nav-actions" id="navActions"></div>
</nav>

<div class="container">
  <h1>🔧 THRIFTI Admin Dashboard</h1>

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-number" id="statUsers">0</div><div>Users</div></div>
    <div class="stat-card"><div class="stat-number" id="statListings">0</div><div>Listings</div></div>
    <div class="stat-card"><div class="stat-number" id="statOrders">0</div><div>Orders</div></div>
    <div class="stat-card"><div class="stat-number" id="statRevenue">R0</div><div>Revenue</div></div>
    <div class="stat-card"><div class="stat-number" id="statFee">R0</div><div>Platform Fee Income</div></div>
  </div>

  <div class="card">
    <h2>👥 Users</h2>
    <div id="usersTable">Loading...</div>
  </div>

  <div class="card">
    <h2>📦 Listings</h2>
    <div id="listingsTable">Loading...</div>
  </div>

  <div class="card">
    <h2>📋 Orders</h2>
    <div id="ordersTable">Loading...</div>
  </div>

  <div class="card">
    <h2>⚠️ Reports</h2>
    <div id="reportsTable">Loading...</div>
  </div>
</div>

<script>
  const API_BASE = 'https://thriftistore-xh2m.onrender.com/api.php';

  async function apiCall(action, method = 'GET', data = null) {
    const url = `${API_BASE}?action=${action}`;
    const options = { method };
    if (data) {
      options.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
      options.body = new URLSearchParams(data);
    }
    const res = await fetch(url, options);
    return await res.json();
  }

  let currentUser = null;

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
  }

  async function checkUser() {
    const data = await apiCall('get_user');
    if (data.success) {
      currentUser = data.user;
      if (currentUser.email !== 'admin@thrifti.com') {
        alert('You are not authorized to view this page.');
        window.location.href = 'index.html';
        return;
      }
    } else {
      window.location.href = 'login.html?admin=1';
      return;
    }
    updateNavbar();
    updateCounts();
    loadAdminData();
  }

  function updateNavbar() {
    const actions = document.getElementById('navActions');
    if (currentUser) {
      const isAdmin = currentUser.email === 'admin@thrifti.com';
      actions.innerHTML = `
        <div class="user-greeting">👋 ${escapeHtml(currentUser.name)} <button id="logoutBtn">Logout</button></div>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="mylistings.html">📋 My Listings</a>
            <a href="mychats.html">💬 My Chats</a>
            <a href="sell.html">📦 SELL</a>
            ${isAdmin ? '<a href="admin.html">🔧 Admin</a>' : ''}
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await apiCall('logout', 'POST');
        currentUser = null;
        updateNavbar();
        window.location.reload();
      });
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
      updateCounts();
    } else {
      actions.innerHTML = `
        <a href="login.html" class="login-link">Log in</a>
        <a href="cart.html" class="cart-link">🛒 <span class="badge-cart" id="cartCount">0</span></a>
        <a href="wishlist.html" class="wishlist-link">💚 <span class="badge-wishlist" id="wishlistCount">0</span></a>
        <div class="dropdown" id="mainDropdown">
          <button class="dropbtn">⋮</button>
          <div class="dropdown-content">
            <a href="login.html?admin=1">🔐 Admin Login</a>
            <a href="manual.html">📖 User Manual</a>
            <a href="contact.html">📧 Contact</a>
          </div>
        </div>
      `;
      document.querySelector('.dropbtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('mainDropdown').classList.toggle('show');
      });
      window.addEventListener('click', () => {
        document.getElementById('mainDropdown')?.classList.remove('show');
      });
      updateCounts();
    }
  }

  async function updateCounts() {
    if (!currentUser) {
      document.getElementById('cartCount').textContent = '0';
      document.getElementById('wishlistCount').textContent = '0';
      return;
    }
    try {
      const cartData = await apiCall('cart');
      if (cartData.success) {
        const total = cartData.cart.reduce((s, i) => s + i.quantity, 0);
        document.getElementById('cartCount').textContent = total;
      }
      const wishData = await apiCall('wishlist');
      if (wishData.success) {
        document.getElementById('wishlistCount').textContent = wishData.wishlist.length;
      }
    } catch(e) {}
  }

  async function loadAdminData() {
    // Stats
    const stats = await apiCall('admin_stats');
    if (stats.success) {
      document.getElementById('statUsers').textContent = stats.stats.users;
      document.getElementById('statListings').textContent = stats.stats.listings;
      document.getElementById('statOrders').textContent = stats.stats.orders;
      document.getElementById('statRevenue').textContent = 'R' + parseFloat(stats.stats.revenue).toFixed(2);
      document.getElementById('statFee').textContent = 'R' + parseFloat(stats.stats.fee_income).toFixed(2);
    }

    // Users
    const users = await apiCall('admin_users');
    if (users.success) { renderUsers(users.users); }

    // Listings
    const listings = await apiCall('admin_listings');
    if (listings.success) { renderListings(listings.listings); }

    // Orders
    const orders = await apiCall('admin_orders');
    if (orders.success) { renderOrders(orders.orders); }

    // Reports
    const reports = await apiCall('admin_reports');
    if (reports.success) { renderReports(reports); }
  }

  function renderUsers(users) {
    const container = document.getElementById('usersTable');
    if (!users.length) { container.innerHTML = '<p>No users.</p>'; return; }
    let html = '<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Created</th></tr></thead><tbody>';
    users.forEach(u => {
      html += `<tr><td>${u.id}</td><td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.email)}</td><td>${new Date(u.created_at).toLocaleString()}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function renderListings(listings) {
    const container = document.getElementById('listingsTable');
    if (!listings.length) { container.innerHTML = '<p>No listings.</p>'; return; }
    let html = '<table><thead><tr><th>ID</th><th>Name</th><th>Seller</th><th>Price</th><th>Location</th></tr></thead><tbody>';
    listings.forEach(l => {
      html += `<tr><td>${l.id}</td><td>${escapeHtml(l.name)}</td><td>${escapeHtml(l.seller_name || l.seller_email)}</td><td>R ${parseFloat(l.price).toLocaleString()}</td><td>${escapeHtml(l.location)}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function renderOrders(orders) {
    const container = document.getElementById('ordersTable');
    if (!orders.length) { container.innerHTML = '<p>No orders.</p>'; return; }
    let html = '<table><thead><tr><th>ID</th><th>Buyer</th><th>Total</th><th>Fee</th><th>Seller Gets</th><th>Status</th><th>Date</th></tr></thead><tbody>';
    orders.forEach(o => {
      html += `<tr>
        <td>${o.id}</td>
        <td>${escapeHtml(o.buyer_name)}<br><small>${escapeHtml(o.buyer_email)}</small></td>
        <td>R ${parseFloat(o.total).toFixed(2)}</td>
        <td>R ${parseFloat(o.fee || 0).toFixed(2)}</td>
        <td>R ${parseFloat(o.seller_gets || 0).toFixed(2)}</td>
        <td>${o.status || 'pending'}</td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function renderReports(reports) {
    const container = document.getElementById('reportsTable');
    const items = reports.reported_items || [];
    const users = reports.reported_users || [];
    if (!items.length && !users.length) { container.innerHTML = '<p>No reports.</p>'; return; }
    let html = '<h3>Reported Items</h3><table><thead><tr><th>Item</th><th>Reason</th><th>Reported By</th><th>Date</th></tr></thead><tbody>';
    items.forEach(r => {
      html += `<tr><td>${escapeHtml(r.item_name)}</td><td>${escapeHtml(r.reason)}</td><td>${escapeHtml(r.reporter_name)}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;
    });
    html += '</tbody></table><h3>Reported Users</h3><table><thead><tr><th>Reported User</th><th>Reason</th><th>Reported By</th><th>Date</th></tr></thead><tbody>';
    users.forEach(r => {
      html += `<tr><td>${escapeHtml(r.reported_name)}</td><td>${escapeHtml(r.reason)}</td><td>${escapeHtml(r.reporter_name)}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  checkUser();
</script>
</body>
</html>
